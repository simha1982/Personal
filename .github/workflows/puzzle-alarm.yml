name: Puzzle Alarm APK

on:
  push:
    paths:
      - "PuzzleAlarm/**"
      - ".github/workflows/puzzle-alarm.yml"
  pull_request:
    paths:
      - "PuzzleAlarm/**"
      - ".github/workflows/puzzle-alarm.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PuzzleAlarm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PuzzleAlarm-debug-apk
          path: PuzzleAlarm/app/build/outputs/apk/debug/app-debug.apk
